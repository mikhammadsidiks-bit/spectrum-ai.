workflows:
  android-workflow:
    name: SPECTRUM AI Android
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.spectrumai.app"
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          gradle --version
          gradle :app:assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
